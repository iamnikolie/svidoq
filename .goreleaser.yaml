version: 2

project_name: svidoq

before:
  hooks:
    - go mod tidy

builds:
  - id: svidoq
    binary: svidoq
    main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/iamnikolie/svidoq/cmd.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request

release:
  draft: false
  prerelease: auto

# Formula in iamnikolie/homebrew-tap, rewritten on every tag. Needs the
# HOMEBREW_TAP_TOKEN secret (fine-grained, contents:write on homebrew-tap only).
brews:
  - name: svidoq
    repository:
      owner: iamnikolie
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    commit_author:
      name: Mykola Klitovchenko
      email: mykola.klitovchenko@gmail.com
    commit_msg_template: "{{ .ProjectName }} {{ .Version }}"
    homepage: https://github.com/iamnikolie/svidoq
    description: "Read-only SQL for agents — parsed allowlist plus a read-only transaction"
    license: MIT
    skip_upload: auto
    install: |
      bin.install "svidoq"
    test: |
      assert_match(/^svidoq /, shell_output("#{bin}/svidoq version"))
